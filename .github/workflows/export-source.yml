name: Export ART source for diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and export exact source archive
        shell: pwsh
        run: |
          if (!(Test-Path 'ART-Desktop-v2.0.1-source.zip')) { throw 'Source archive is missing.' }
          if (!(Test-Path 'ART-Desktop-v2.0.1-source.zip.sha256')) { throw 'SHA-256 sidecar is missing.' }
          $expected = ((Get-Content 'ART-Desktop-v2.0.1-source.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'ART-Desktop-v2.0.1-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Source archive SHA-256 mismatch.' }

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: ART-Desktop-source-debug
          path: |
            ART-Desktop-v2.0.1-source.zip
            ART-Desktop-v2.0.1-source.zip.sha256
          if-no-files-found: error
          retention-days: 7
