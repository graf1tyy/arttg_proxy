name: One-time cleanup of obsolete branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-extra-branches.yml"

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          for branch in android-art-transport inspect-desktop-source; do
            if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            else
              echo "$branch already absent"
            fi
          done

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          blob_sha="$(git rev-parse 'HEAD:.github/workflows/cleanup-extra-branches.yml')"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/cleanup-extra-branches.yml" \
            -f message="chore: remove one-time branch cleanup workflow" \
            -f sha="$blob_sha" \
            -f branch=main
