name: Build ART for Windows
# Build trigger: main
# Release is published by a commit titled: release: ART Desktop v2.0.2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: pwsh
        run: |
          if (!(Test-Path 'ART-Desktop-v2.0.1-source.zip')) { throw 'Source archive is missing from repository root.' }
          if (!(Test-Path 'ART-Desktop-v2.0.1-source.zip.sha256')) { throw 'SHA-256 sidecar is missing.' }
          $expected = ((Get-Content 'ART-Desktop-v2.0.1-source.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'ART-Desktop-v2.0.1-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Source ZIP SHA-256 mismatch. Expected $expected, got $actual" }
          Expand-Archive -Path 'ART-Desktop-v2.0.1-source.zip' -DestinationPath source -Force
          if (!(Test-Path 'source/ART-Desktop-v2.0.1/app.py')) { throw 'Source archive layout is invalid.' }
          Copy-Item 'ART-Desktop-v2.0.1/art/ui_patch.py' 'source/ART-Desktop-v2.0.1/art/ui_patch.py' -Force
          Copy-Item 'ART-Desktop-v2.0.1/onefile_patch.py' 'source/ART-Desktop-v2.0.1/onefile_patch.py' -Force
          $appPath = 'source/ART-Desktop-v2.0.1/app.py'
          $appSource = Get-Content $appPath -Raw
          $anchor = 'from art.ui import MainWindow'
          if (!$appSource.Contains('install_ui_patch()')) {
            if (!$appSource.Contains($anchor)) { throw 'Could not locate the ART GUI import for runtime patch installation.' }
            $appSource = $appSource.Replace($anchor, "$anchor`nfrom art.ui_patch import install_ui_patch`ninstall_ui_patch()")
            Set-Content -Path $appPath -Value $appSource -Encoding utf8 -NoNewline
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: source/ART-Desktop-v2.0.1/requirements.txt

      - name: Install dependencies and pinned transport core
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          git clone --depth 1 --branch v1.11.4 https://github.com/Flowseal/tg-ws-proxy.git vendor/tg-ws-proxy
          python -m pip install -e vendor/tg-ws-proxy

      - name: Tune media transport and compile
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        run: |
          @'
          """ART Engine stdin-config entry point with safe transport defaults."""
          import json
          import sys

          from proxy.tg_ws_proxy import main

          raw_args = sys.stdin.read()
          try:
              args = json.loads(raw_args)
              if not isinstance(args, list) or not all(isinstance(item, str) for item in args):
                  raise ValueError("ART engine configuration must be a JSON list of strings")
          except Exception as exc:
              raise SystemExit(f"Invalid ART Engine configuration: {exc}")

          if "--no-h2" not in args:
              args.append("--no-h2")
          if "--pool-size" not in args:
              args.extend(["--pool-size", "8"])
          if "--no-secure" not in args:
              args.append("--no-secure")

          sys.argv = [sys.argv[0], *args]
          main()
          '@ | Set-Content engine_entry.py -Encoding utf8
          python onefile_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Single-file source patch failed.' }
          python -m compileall -q app.py engine_entry.py art tests onefile_patch.py
      - name: Run ART tests
        working-directory: source/ART-Desktop-v2.0.1
        run: python -m unittest discover -s tests -v

      - name: Smoke test Qt interface, connection and titlebar controls
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'art-qt-smoke'
          @'
          import app as art_app  # installs the same runtime patch used by packaged ART.exe
          from PySide6.QtCore import Qt
          from PySide6.QtWidgets import QApplication, QPushButton, QFrame
          import art.ui as ui_module
          from art.ui import MainWindow

          qt = QApplication([])
          window = MainWindow()
          window.show()
          qt.processEvents()

          assert window.connect_btn.text() == "Подключить Telegram", window.connect_btn.text()
          assert not window.connect_btn.isHidden(), "Connect button is hidden"
          assert window.connect_btn.isEnabled(), "Connect button is disabled"

          titlebar = window.findChild(QFrame, "titlebar")
          assert titlebar is not None, "Titlebar frame missing"
          controls = titlebar.findChildren(QPushButton, options=Qt.FindChildOption.FindDirectChildrenOnly)
          controls.sort(key=lambda button: button.geometry().x())
          assert len(controls) == 3, f"Expected three direct titlebar buttons, got {len(controls)}"
          assert [b.objectName() for b in controls] == ["window_minimize", "window_maximize", "window_close"]
          assert all(b.text() == "" for b in controls), "Titlebar should use vector icons, not font glyphs"
          assert all(not b.icon().isNull() for b in controls), "A titlebar icon is missing"
          assert all(not b.isHidden() and b.isEnabled() for b in controls), "A titlebar button is not usable"

          starts = []
          window.start_engine = lambda: starts.append("start")
          window.engine_process = None
          window.connect_btn.click()
          assert starts == ["start"], f"Connect click did not start engine: {starts}"

          class RunningProcess:
              def poll(self):
                  return None

          opened = []
          window.engine_process = RunningProcess()
          ui_module.is_local_listener = lambda host, port: True
          window.open_telegram = lambda: opened.append("open")
          window._apply_state(True, "Active", "Bridge is active")
          assert window.connect_btn.text() == "Открыть Telegram", window.connect_btn.text()
          assert not window.connect_btn.isHidden(), "Open Telegram button is hidden while active"
          assert window.connect_btn.isEnabled(), "Open Telegram button is disabled"
          window.connect_btn.click()
          assert opened == ["open"], f"Active connect button did not open Telegram: {opened}"

          minimized = []
          controls[0].clicked.connect(lambda: minimized.append(True))
          controls[0].click()
          assert minimized and window.isMinimized(), "Minimize button action failed"
          window.showNormal()
          qt.processEvents()

          controls[1].click()
          qt.processEvents()
          assert window.isMaximized(), "Maximize button action failed"
          assert not controls[1].icon().isNull(), "Restore icon disappeared after maximize"
          controls[1].click()
          qt.processEvents()
          assert not window.isMaximized(), "Restore button action failed"

          closed = []
          controls[2].clicked.connect(lambda: closed.append(True))
          controls[2].click()
          qt.processEvents()
          assert closed and not window.isVisible(), "Close button action failed"
          print("ART_QT_TITLEBAR_AND_CONNECT_CONTROLS_OK")
          '@ | Set-Content qt_connect_smoke.py -Encoding utf8
          python qt_connect_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt titlebar or connection control regression test failed.' }

      - name: Build and smoke test headless engine
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name ART-Engine --distpath build/engine-dist --workpath build/engine --specpath build/engine engine_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'ART Engine PyInstaller build failed.' }
          '["--help"]' | & build/engine-dist/ART-Engine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine smoke test failed.' }

      - name: Build and smoke test single-file ART
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ART --icon (Join-Path $PWD 'assets/art.ico') --add-data "$(Join-Path $PWD 'assets');assets" --add-data "$(Join-Path $PWD 'build/engine-dist/ART-Engine.exe');engine" --add-data "$(Join-Path $PWD 'THIRD-PARTY-LICENSE.txt');licenses" --distpath dist --workpath build/gui --specpath build/gui app.py
          if ($LASTEXITCODE -ne 0) { throw 'Single-file ART PyInstaller build failed.' }
          if (!(Test-Path 'dist/ART.exe')) { throw 'Single-file dist/ART.exe missing.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'art-onefile-smoke'
          & dist/ART.exe --bundle-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Bundled engine smoke test failed with exit code $LASTEXITCODE." }
          & dist/ART.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen ART GUI smoke test failed with exit code $LASTEXITCODE." }
          $guiHash = (Get-FileHash 'dist/ART.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$guiHash  ART.exe" | Set-Content 'dist/ART.exe.sha256' -Encoding ascii

      - name: Upload single-file Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ART-Desktop-Windows-x64-OneFile
          path: |
            source/ART-Desktop-v2.0.1/dist/ART.exe
            source/ART-Desktop-v2.0.1/dist/ART.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v2.0.2
        if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ART Desktop v2.0.2') }}"
        shell: pwsh
        working-directory: source/ART-Desktop-v2.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = 'v2.0.2'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            tag_name = $version
            target_commitish = 'main'
            name = 'ART Desktop v2.0.2'
            body = 'Единый portable EXE для Windows x64. Скачайте ART.exe и запустите двойным щелчком. Отдельная папка с движком и установка не нужны. Встроенный тест проверяет запуск MTProto-моста из ресурсов самого EXE.'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json
          $api = 'https://api.github.com/repos/graf1tyy/arttg_proxy/releases'
          $release = Invoke-RestMethod -Uri $api -Method Post -Headers $headers -ContentType 'application/json' -Body $body
          $uploadRoot = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($assetPath in @('dist/ART.exe', 'dist/ART.exe.sha256')) {
            $assetName = [uri]::EscapeDataString([IO.Path]::GetFileName($assetPath))
            $uploadUri = "$uploadRoot?name=$assetName"
            Invoke-WebRequest -Uri $uploadUri -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $assetPath | Out-Null
          }
          Write-Host "Published release: $($release.html_url)"
