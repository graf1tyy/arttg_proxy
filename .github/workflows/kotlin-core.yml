name: ART Kotlin core

on:
  push:
    branches: [main]
    paths:
      - "ART-Kotlin/**"
      - ".github/workflows/kotlin-core.yml"
  pull_request:
    paths:
      - "ART-Kotlin/**"
      - ".github/workflows/kotlin-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ART-Kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Compile common Kotlin code and run shared tests
        run: gradle --no-daemon :core:jvmTest
