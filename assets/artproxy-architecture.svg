<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">ARTproxy connection flow</title>
  <desc id="desc">Telegram connects to a local ART bridge. ART routes traffic through WebSocket, Cloudflare or TCP fallback to Telegram data centres.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131a"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8aaeff"/><stop offset="1" stop-color="#5d83cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect x="1" y="1" width="1118" height="298" rx="24" fill="url(#bg)" stroke="#2a303b"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f6f7f9">
    <text x="34" y="43" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8aaeff">ARTproxy · LOCAL ROUTING</text>
    <text x="34" y="71" font-size="20" font-weight="700">Без публичных MTProto-списков</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="32" y="112" width="205" height="132" rx="18" fill="#171c25" stroke="#303847"/>
    <rect x="270" y="112" width="230" height="132" rx="18" fill="#171c25" stroke="#8aaeff" stroke-opacity=".6"/>
    <rect x="533" y="112" width="250" height="132" rx="18" fill="#171c25" stroke="#303847"/>
    <rect x="816" y="112" width="272" height="132" rx="18" fill="#171c25" stroke="#303847"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f6f7f9" text-anchor="middle">
    <text x="134" y="159" font-size="18" font-weight="700">Telegram</text>
    <text x="134" y="184" font-size="12" fill="#aeb5c1">официальный клиент</text>
    <text x="134" y="211" font-size="11" fill="#8aaeff">tg://proxy</text>
    <text x="385" y="154" font-size="18" font-weight="700">ART local bridge</text>
    <text x="385" y="180" font-size="12" fill="#aeb5c1">127.0.0.1 · локальный порт</text>
    <text x="385" y="209" font-size="11" fill="#8aaeff">Rust / Tokio core</text>
    <text x="658" y="154" font-size="18" font-weight="700">ART transport</text>
    <text x="658" y="180" font-size="12" fill="#aeb5c1">WebSocket / WSS</text>
    <text x="658" y="202" font-size="12" fill="#aeb5c1">Cloudflare · TCP fallback</text>
    <text x="952" y="159" font-size="18" font-weight="700">Telegram DC</text>
    <text x="952" y="184" font-size="12" fill="#aeb5c1">дата-центры Telegram</text>
    <text x="952" y="211" font-size="11" fill="#8aaeff">внешнее соединение</text>
  </g>
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M237 178h29m-8 -8 8 8 -8 8"/>
    <path d="M500 178h29m-8 -8 8 8 -8 8"/>
    <path d="M783 178h29m-8 -8 8 8 -8 8"/>
  </g>
</svg>
