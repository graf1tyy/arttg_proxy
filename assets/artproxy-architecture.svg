<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Как устроен ARTproxy</title>
  <desc id="desc">Telegram подключается к локальному мосту ARTproxy, который использует WebSocket и резервные сетевые маршруты для связи с дата-центрами Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#090c12"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#759eea"/><stop offset="1" stop-color="#aac5ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#bg)" stroke="#2c3748" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="48" y="53" font-size="13" font-weight="700" letter-spacing="3" fill="#8aaeff">СХЕМА СОЕДИНЕНИЯ</text>
    <text x="48" y="88" font-size="25" font-weight="700" fill="#f5f7fb">Не публичный список прокси, а собственный локальный маршрут</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="45" y="145" width="230" height="186" rx="20" fill="#161f2c" stroke="#39485e" stroke-width="2"/>
    <rect x="337" y="145" width="245" height="186" rx="20" fill="#172337" stroke="#789ce0" stroke-width="2"/>
    <rect x="644" y="145" width="250" height="186" rx="20" fill="#161f2c" stroke="#39485e" stroke-width="2"/>
    <rect x="956" y="145" width="199" height="186" rx="20" fill="#161f2c" stroke="#39485e" stroke-width="2"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g fill="#f5f7fb">
      <text x="160" y="207" font-size="23" font-weight="700">Telegram</text>
      <text x="459" y="207" font-size="22" font-weight="700">ART bridge</text>
      <text x="769" y="207" font-size="22" font-weight="700">ART transport</text>
      <text x="1055" y="207" font-size="22" font-weight="700">Telegram DC</text>
    </g>
    <g fill="#aeb9ca" font-size="14">
      <text x="160" y="239">Официальное приложение</text>
      <text x="459" y="239">Локальный MTProto-порт</text>
      <text x="769" y="239">WS / WSS · Cloudflare</text>
      <text x="1055" y="239">Дата-центры</text>
    </g>
    <g fill="#8aaeff" font-family="ui-monospace,Consolas,monospace" font-size="13">
      <text x="160" y="281">tg://proxy</text>
      <text x="459" y="281">127.0.0.1</text>
      <text x="769" y="281">TCP fallback</text>
      <text x="1055" y="281">Зашифрованный</text>
      <text x="1055" y="300">трафик</text>
    </g>
  </g>
  <g stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M275 238h53m-14 -13 14 13 -14 13"/>
    <path d="M582 238h55m-14 -13 14 13 -14 13"/>
    <path d="M894 238h55m-14 -13 14 13 -14 13"/>
  </g>
  <text x="48" y="383" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#96a3b7">Локальный адрес нужен только для связи Telegram с мостом. Внешний маршрут выбирает ARTproxy.</text>
</svg>