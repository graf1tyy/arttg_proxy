<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Визуальная концепция интерфейса ARTproxy для Android</title>
  <desc id="desc">Схематичное изображение экрана приложения с тёмной темой, статусом локального моста и кнопками управления.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#080a0e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="87" font-size="15" font-weight="700" letter-spacing="3" fill="#8aaeff">ANDROID APP PREVIEW</text>
    <text x="72" y="133" font-size="32" font-weight="700" fill="#f6f7f9">Только самое важное на главном экране</text>
    <text x="72" y="167" font-size="16" fill="#aeb8c8">Статус локального моста, одна основная кнопка и быстрый переход в Telegram.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="400" y="205" width="400" height="405" rx="40" fill="#08090b" stroke="#394457" stroke-width="3"/>
    <rect x="418" y="224" width="364" height="367" rx="29" fill="#0d1118"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="438" y="248" width="43" height="43" rx="12" fill="#08090b" stroke="#33415a"/>
    <path d="M447 278l9 -21h6l9 21h-7l-2 -5h-7l-2 5z" fill="#f6f7f9"/>
    <text x="493" y="268" font-size="19" font-weight="700" fill="#f6f7f9">ARTproxy</text>
    <text x="493" y="285" font-size="9" font-weight="700" letter-spacing="1.2" fill="#7d899c">PRIVATE ROUTE FOR TELEGRAM</text>
    <text x="438" y="340" font-size="10" font-weight="700" letter-spacing="2" fill="#7d899c">ПОДКЛЮЧЕНИЕ</text>
    <text x="438" y="375" font-size="21" font-weight="700" fill="#f6f7f9">Твой маршрут.</text>
    <text x="438" y="400" font-size="21" font-weight="700" fill="#f6f7f9">Без лишних серверов.</text>
    <rect x="438" y="425" width="324" height="100" rx="18" fill="#171d27" stroke="#303a49"/>
    <rect x="456" y="442" width="124" height="24" rx="12" fill="#202b3b"/>
    <circle cx="470" cy="454" r="4" fill="#8aaeff"/>
    <text x="482" y="458" font-size="9" font-weight="700" fill="#b9c9e4">МОСТ АКТИВЕН</text>
    <text x="456" y="490" font-size="16" font-weight="700" fill="#f6f7f9">Локальный мост запущен</text>
    <text x="456" y="510" font-size="10" fill="#98a4b5">127.0.0.1 : 1443</text>
    <rect x="438" y="541" width="324" height="37" rx="12" fill="#f3f6fb"/>
    <text x="600" y="565" font-size="11" font-weight="700" text-anchor="middle" fill="#0a0d13">ОТКРЫТЬ TELEGRAM</text>
  </g>
  <text x="600" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#7d899c">Схематичный preview · не скриншот запущенного приложения</text>
</svg>